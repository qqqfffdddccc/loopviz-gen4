<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLOUD — Minimalist Audio Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Rubik:wght@500;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #F8F9FC;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1E293B;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom Apple-like slim scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(200, 215, 235, 0.5);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(180, 200, 225, 0.8);
      }
    
      /* Interactive Loop Timeline / Dual-handle Range */
      .timeline-track-container {
        position: relative;
        user-select: none;
        touch-action: none;
      }
      .timeline-bar {
        position: relative;
        height: 10px;
        background: rgba(226, 232, 240, 0.8);
        border-radius: 9999px;
        overflow: hidden;
      }
      .timeline-region {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, rgba(59, 130, 246, 0.28), rgba(99, 102, 241, 0.35));
        border-left: 2px solid #3b82f6;
        border-right: 2px solid #6366f1;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
        cursor: grab;
      }
      .timeline-region:active {
        cursor: grabbing;
      }
      .timeline-handle {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 24px;
        background: #ffffff;
        border: 2px solid #2563eb;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        cursor: ew-resize;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .timeline-handle:hover {
        transform: translate(-50%, -50%) scale(1.12);
        box-shadow: 0 3px 12px rgba(37, 99, 235, 0.5);
      }
      .timeline-handle::after {
        content: '';
        width: 2px;
        height: 10px;
        background: #93c5fd;
        border-radius: 1px;
      }
      .timeline-playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #0f172a;
        box-shadow: 0 0 8px rgba(15, 23, 42, 0.5);
        pointer-events: none;
        z-index: 15;
      }
      .timeline-playhead::after {
        content: '';
        position: absolute;
        top: -4px;
        left: -4px;
        width: 10px;
        height: 10px;
        background: #0f172a;
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
</style>
